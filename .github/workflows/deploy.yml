# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
        env:
          # Environment Variables
          VITE_PAYPAL_URL: ${{ vars.VITE_PAYPAL_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_PORT: ${{ vars.VITE_PORT }}
          
          # Environment Secrets
          VITE_PRO_M_ID: ${{ secrets.VITE_PRO_M_ID }}
          VITE_PRO_Y_ID: ${{ secrets.VITE_PRO_Y_ID }}
          VITE_PREMIUM_M_ID: ${{ secrets.VITE_PREMIUM_M_ID }}
          VITE_PREMIUM_Y_ID: ${{ secrets.VITE_PREMIUM_Y_ID }}
          VITE_INSTI_M_ID: ${{ secrets.VITE_INSTI_M_ID }}
          VITE_INSTI_Y_ID: ${{ secrets.VITE_INSTI_Y_ID }}
          VITE_PAYPAL_ID: ${{ secrets.VITE_PAYPAL_ID }}
          VITE_PAYPAL_SECRET: ${{ secrets.VITE_PAYPAL_SECRET }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: './dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4